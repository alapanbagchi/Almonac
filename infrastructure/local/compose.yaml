# Local Zitadel stack for development and CI only.
#
# This is not a production deployment. It runs one replica of everything and
# keeps secrets in a local .env file. The Zitadel API is published directly;
# there is no hosted login UI or development proxy.
# See docs/architecture/decisions/013-self-hosted-zitadel-deployment.md for the
# production shape.
name: almonac-local

services:
  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    restart: unless-stopped
    # The official image writes the login-client PAT into a volume. Root is
    # used for that write in local development only.
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in .env}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      ZITADEL_TELEMETRY_ENABLED: "false"
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"

      # First instance: one human IAM_OWNER and the login-client machine user.
      # This stack does not create an Almonac project, OIDC application, SMTP
      # provider or users. Product provisioning is not implemented.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Almonac
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin@almonac.local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@almonac.local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD in .env}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"

      # Login v2 is required in Zitadel 4.x, but this stack does not run the
      # login UI. The API only reads the redirect Location from the login client.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Almonac login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${ZITADEL_PUBLIC_SCHEME}://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${ZITADEL_PUBLIC_SCHEME}://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${ZITADEL_PUBLIC_SCHEME}://${ZITADEL_DOMAIN}:${ZITADEL_EXTERNALPORT}/ui/v2/login/logout?post_logout_redirect=
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s
    ports:
      - "127.0.0.1:${ZITADEL_EXTERNALPORT:-8080}:8080"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - almonac-local
    depends_on:
      postgres:
        condition: service_healthy

  registry-postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REGISTRY_POSTGRES_DB}
      POSTGRES_USER: ${REGISTRY_POSTGRES_USER}
      POSTGRES_PASSWORD: "${REGISTRY_POSTGRES_PASSWORD:?set REGISTRY_POSTGRES_PASSWORD in .env}"
      REGISTRY_POSTGRES_TEST_DB: ${REGISTRY_POSTGRES_TEST_DB}
    ports:
      - "127.0.0.1:${REGISTRY_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - registry-postgres:/var/lib/postgresql/data:rw
      - ./init/registry-db/01-create-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    networks:
      - almonac-local

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - zitadel-postgres:/var/lib/postgresql/data:rw
    networks:
      - almonac-local

networks:
  almonac-local:
    name: almonac-local

volumes:
  registry-postgres:
  zitadel-postgres:
  zitadel-bootstrap: